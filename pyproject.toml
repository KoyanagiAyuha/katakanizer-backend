[project]
name = "katakanizer-backend"
version = "2.0.0"
description = "日記をお笑い芸人風に変換する API サーバー"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "openai>=1.55.0",
    "httpx>=0.26.0",
    "pyjwt[crypto]>=2.8.0",
    "resend>=2.0.0",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]

[project.scripts]
app = "src.main:app"
